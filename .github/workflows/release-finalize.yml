# Stage 2 of 2: finalize. Dispatched by a maintainer AFTER acceptance against
# the published packages. It verifies the registry already serves the version,
# verifies the checked-in release note, then creates the annotated tag and the
# GitHub Release from that note. It never publishes to npm — that is release.yml,
# and running finalize without a published version fails loudly.
#
# tag = a declaration that the published artefacts passed acceptance.
name: Release Finalize

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to finalize (e.g. 0.3.3)'
        required: true
      dry_run:
        description: 'Verify everything but create no tag and no Release'
        type: boolean
        default: false

permissions:
  contents: write # tag push + GitHub Release

concurrency:
  group: finalize-${{ inputs.version }}

env:
  NO_COLOR: '1'

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: refuse non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::finalize runs against main only (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: version ↔ manifest consistency
        run: |
          V="${{ inputs.version }}"
          for p in runtime bootstrap; do
            M=$(node -p "require('./packages/$p/package.json').version")
            [ "$M" = "$V" ] || { echo "::error::packages/$p is $M, dispatch says $V"; exit 1; }
          done

      - name: registry already serves this version
        run: |
          V="${{ inputs.version }}"
          SOFT=""
          if ${{ inputs.dry_run }}; then SOFT=1; fi
          for p in runtime bootstrap; do
            curl -fs -m 20 -H 'Cache-Control: no-cache' -o /dev/null \
              "https://registry.npmjs.org/@asc-agent%2f$p/$V" \
              || { if [ -n "$SOFT" ]; then echo "dry run: @asc-agent/$p@$V is not on the registry (a real finalize would stop here)"; else echo "::error::@asc-agent/$p@$V is not on the registry — run release.yml first"; exit 1; fi; }
          done

      - name: tag does not exist yet
        run: |
          V="${{ inputs.version }}"
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            if ${{ inputs.dry_run }}; then
              echo "dry run: v$V already exists (a real finalize would stop here)"
            else
              echo "::error::v$V already exists — finalize ran already, or the tag was made by hand"
              exit 1
            fi
          fi

      - name: release note exists and is structured
        run: |
          V="${{ inputs.version }}"
          NOTE="docs/releases/v$V.md"
          [ -f "$NOTE" ] || { echo "::error::$NOTE is missing — the Release body is authored, not generated"; exit 1; }
          for section in "## What changed" "## Install / Upgrade" "## Agent setup" "## Compatibility" "## Verified" "## Known limitations"; do
            grep -qF "$section" "$NOTE" || { echo "::error::$NOTE lacks required section: $section"; exit 1; }
          done
          grep -qF "$V" "$NOTE" || { echo "::error::$NOTE never names $V"; exit 1; }

      - name: annotated tag
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # First line is the title; the body is the note's lead paragraph.
          LEAD=$(awk '/^[^#[]/{print; exit}' "docs/releases/v$V.md")
          git tag -a "v$V" -m "ASC v$V" -m "$LEAD"
          git push origin "v$V"

      - name: GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          gh release create "v$V" \
            --title "ASC v$V" \
            --notes-file "docs/releases/v$V.md"

      - name: result
        run: |
          if ${{ inputs.dry_run }}; then
            echo "Dry run complete. All finalize gates hold; no tag, no Release."
          else
            echo "v${{ inputs.version }} tagged (annotated) and the GitHub Release is up."
          fi
