# Stage 2 of 2: finalize. Dispatched by a maintainer AFTER acceptance against
# the published packages. It verifies the registry already serves the version,
# verifies the checked-in release note, then creates the annotated tag and the
# GitHub Release from that note. It never publishes to npm — that is release.yml,
# and running finalize without a published version fails loudly.
#
# tag = a declaration that the published artefacts passed acceptance.
name: Release Finalize

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to finalize (e.g. 0.3.3)'
        required: true
      dry_run:
        description: 'Verify everything but create no tag and no Release'
        type: boolean
        default: false

permissions:
  contents: write # tag push + GitHub Release

concurrency:
  group: finalize-${{ inputs.version }}

env:
  NO_COLOR: '1'

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: refuse non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::finalize runs against main only (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: version ↔ manifest consistency
        run: |
          V="${{ inputs.version }}"
          for p in runtime bootstrap; do
            M=$(node -p "require('./packages/$p/package.json').version")
            [ "$M" = "$V" ] || { echo "::error::packages/$p is $M, dispatch says $V"; exit 1; }
          done

      - name: registry already serves this version
        run: |
          V="${{ inputs.version }}"
          SOFT=""
          if ${{ inputs.dry_run }}; then SOFT=1; fi
          for p in runtime bootstrap; do
            curl -fs -m 20 -H 'Cache-Control: no-cache' -o /dev/null \
              "https://registry.npmjs.org/@asc-agent%2f$p/$V" \
              || { if [ -n "$SOFT" ]; then echo "dry run: @asc-agent/$p@$V is not on the registry (a real finalize would stop here)"; else echo "::error::@asc-agent/$p@$V is not on the registry — run release.yml first"; exit 1; fi; }
          done

      # The tag must point at the commit the registry actually published, not
      # at whatever main is when finalize runs — main is allowed to move between
      # the stages. npm's signed provenance (Trusted Publishing) is the durable
      # record of that commit; resolve it, and verify it is a real commit whose
      # manifests carry this version. This gate is never softened: even a dry
      # run resolves the real identity.
      - name: resolve the published commit (npm provenance)
        id: published
        run: |
          V="${{ inputs.version }}"
          SHA=$(node scripts/resolve-published-commit.mjs "$V")
          echo "published commit: $SHA"
          git cat-file -e "$SHA^{commit}" || { echo "::error::$SHA is not a commit in this repository"; exit 1; }
          for p in runtime bootstrap; do
            M=$(git show "$SHA:packages/$p/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            [ "$M" = "$V" ] || { echo "::error::packages/$p at $SHA is $M, expected $V — that commit did not publish this version"; exit 1; }
          done
          git show "$SHA:docs/releases/v$V.md" > /dev/null 2>&1             || { echo "::error::docs/releases/v$V.md does not exist at the published commit $SHA"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "current HEAD: $(git rev-parse HEAD) — a real finalize tags $SHA regardless"

      - name: tag does not exist yet
        run: |
          V="${{ inputs.version }}"
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            if ${{ inputs.dry_run }}; then
              echo "dry run: v$V already exists (a real finalize would stop here)"
            else
              echo "::error::v$V already exists — finalize ran already, or the tag was made by hand"
              exit 1
            fi
          fi

      - name: release note exists and is structured
        run: |
          V="${{ inputs.version }}"
          # The body that ships is the note AT the published commit — validate
          # that one, not whatever the current checkout holds.
          NOTE=/tmp/note-gate.md
          git show "${{ steps.published.outputs.sha }}:docs/releases/v$V.md" > "$NOTE"             || { echo "::error::docs/releases/v$V.md is missing at the published commit"; exit 1; }
          for section in "## What changed" "## Install / Upgrade" "## Agent setup" "## Compatibility" "## Verified" "## Known limitations"; do
            grep -qF "$section" "$NOTE" || { echo "::error::$NOTE lacks required section: $section"; exit 1; }
          done
          grep -qF "$V" "$NOTE" || { echo "::error::$NOTE never names $V"; exit 1; }

      - name: annotated tag
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHA="${{ steps.published.outputs.sha }}"
          # First line is the title; the body is the lead paragraph of the note
          # AS PUBLISHED — read at the published commit, not at current HEAD.
          git show "$SHA:docs/releases/v$V.md" > /tmp/note.md
          LEAD=$(awk '/^[^#[]/{print; exit}' /tmp/note.md)
          git tag -a "v$V" -m "ASC v$V" -m "$LEAD" "$SHA"
          git push origin "v$V"

      - name: GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          gh release create "v$V" \
            --title "ASC v$V" \
            --notes-file "docs/releases/v$V.md"

      - name: result
        run: |
          if ${{ inputs.dry_run }}; then
            echo "Dry run complete. All finalize gates hold; no tag, no Release."
            echo "A real finalize would tag ${{ steps.published.outputs.sha }} (current HEAD: $(git rev-parse HEAD))."
          else
            echo "v${{ inputs.version }} tagged (annotated) and the GitHub Release is up."
          fi
