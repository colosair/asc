# Stage 1 of 2: publish. Dispatched by a maintainer against main; it gates,
# publishes via npm Trusted Publishing (OIDC), verifies the registry, and runs a
# published smoke. It creates NO tag and NO GitHub Release — those belong to
# release-finalize.yml, which runs only after acceptance against the published
# artefacts. That order is the invariant: a tag is a claim that the published
# artefacts passed acceptance, so nothing here may create one.
#
# The filename stays release.yml because npm's trusted-publisher connection is
# bound to repo + workflow filename. Renaming it breaks publishing silently.
#
# Requirements this workflow encodes (npm trusted-publishers contract, 2026):
#   - GitHub-hosted runner, npm CLI >= 11.5.1, Node >= 22.14
#   - `permissions.id-token: write` — no long-lived npm token anywhere
#   - each package is connected to this repo + this filename on npmjs.com
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must equal the manifests on main HEAD, e.g. 0.3.3)'
        required: true
      dry_run:
        description: 'Run every gate but publish with --dry-run and skip registry/smoke'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm Trusted Publishing

concurrency:
  group: release-${{ inputs.version }}

env:
  NO_COLOR: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: refuse non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish runs against main only (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The runner's bundled npm can trail the trusted-publishing floor.
      - run: npm install -g npm@^11.5.1 && npm --version

      - name: version ↔ manifest consistency
        run: |
          V="${{ inputs.version }}"
          for p in runtime bootstrap; do
            M=$(node -p "require('./packages/$p/package.json').version")
            [ "$M" = "$V" ] || { echo "::error::packages/$p is $M, dispatch says $V"; exit 1; }
          done

      # An immutable registry means a re-publish of the same version can only
      # fail late and confusingly. Refuse it up front instead.
      - name: version is not already published
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ inputs.version }}"
          for p in runtime bootstrap; do
            if curl -fs -m 20 -o /dev/null "https://registry.npmjs.org/@asc-agent%2f$p/$V"; then
              echo "::error::@asc-agent/$p@$V already exists on the registry — bump the version instead"
              exit 1
            fi
          done

      - run: npm ci

      # The full CI gate, re-run on the exact commit being published.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run release:check
      - run: npm run pack:all
      - run: npm run smoke

      # Order matters: bootstrap pins runtime exactly, so runtime must exist
      # on the registry before anyone can install bootstrap.
      - name: publish (runtime → bootstrap)
        run: |
          FLAGS=""
          if ${{ inputs.dry_run }}; then
            FLAGS="--dry-run"
            # npm refuses --dry-run over an already-published version too, and
            # a released version is the only honest target a pipeline dry run
            # has. Fall back to the packing check alone in that case.
            V="${{ inputs.version }}"
            if curl -fs -m 20 -o /dev/null "https://registry.npmjs.org/@asc-agent%2fruntime/$V"; then
              echo "dry run: $V is already on the registry — npm pack --dry-run only (a real publish would be refused by the version gate)"
              (cd packages/runtime && npm pack --dry-run)
              (cd packages/bootstrap && npm pack --dry-run)
              exit 0
            fi
          fi
          (cd packages/runtime && npm publish $FLAGS)
          (cd packages/bootstrap && npm publish $FLAGS)

      # npm's client cache can answer with a stale 404 for a version published
      # seconds earlier, and registry propagation has overrun a 5-minute window
      # for real (asc v0.3.2, run 33350405149's sibling: publish succeeded, the
      # old verification failed). Ask the registry over HTTP with caching off,
      # and give propagation 15 minutes before calling it a failure.
      - name: registry verification
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ inputs.version }}"
          for p in runtime bootstrap; do
            ok=""
            for i in $(seq 1 90); do
              if curl -fs -m 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                   -o /dev/null "https://registry.npmjs.org/@asc-agent%2f$p/$V"; then
                ok=1
                echo "@asc-agent/$p@$V visible after $(( (i - 1) * 10 ))s"
                break
              fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "::error::@asc-agent/$p@$V never appeared on the registry within 15 minutes"; exit 1; }
          done

      - name: published smoke
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ inputs.version }}"
          PREFIX=$(mktemp -d)
          npm install -g --prefer-online --prefix "$PREFIX" "@asc-agent/runtime@$V"
          # Capture, then grep: `cmd | grep -q` kills the pipe on first match
          # and the resulting EPIPE fails the step under pipefail (seen on the
          # jam v1.4.1 run). Exit codes stay visible without a pipe.
          "$PREFIX/bin/asc" > usage.out 2>&1
          grep -q "Agent Session Control" usage.out
          "$PREFIX/bin/asc" --version > version.out 2>&1
          grep -qx "$V" version.out

      - name: record the release-candidate identity
        run: |
          echo "### Release candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "The durable record is npm provenance; finalize resolves the commit from the registry, not from this run."

      - name: what happens next
        run: |
          if ${{ inputs.dry_run }}; then
            echo "Dry run complete. Nothing was published."
          else
            echo "Published @asc-agent/{runtime,bootstrap}@${{ inputs.version }}."
            echo "Run acceptance against the PUBLISHED packages (docs/release/README.md),"
            echo "then dispatch release-finalize.yml with the same version to tag and cut the Release."
          fi
